<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta content="#fffaf0" name="theme-color"/>




<title>投票入力 | GambooBET Demo</title>
<link href="../../shared/category-menu.css?v=64" rel="stylesheet"/>
<link href="../../shared/page-shell.css?v=20" rel="stylesheet"/>
<link href="../race-info.css?v=71" rel="stylesheet"/>
<link href="../race-switch.css?v=73" rel="stylesheet"/>
<link href="../../shared/race-button-style.css?v=7" rel="stylesheet"/>
<link href="bet.css?v=55" rel="stylesheet"/>
<link href="../../shared/gamboo-light-theme.css?v=8" rel="stylesheet"/>
<script defer="" src="../race-info.js?v=68"></script>
<script defer="" src="../live-state.js?v=3"></script>
<script defer="" src="../../shared/category-menu.js?v=66"></script>
<script defer="" src="../../shared/fixed-layout.js?v=23"></script>

<script defer="" src="../odds-data.js?v=1"></script>
<script defer="" src="bet.js?v=28"></script>
</head>
<body>
<gamboo-category-menu active="bet"></gamboo-category-menu>
<div class="gamboo-content-shell" data-gamboo-pinch-shell="">
<div class="gamboo-content-sizer" data-gamboo-pinch-sizer="">
<div class="gamboo-content-stage" data-gamboo-pinch-stage="">
<section aria-label="デルカ残高" class="delca-bar">
<div class="delca-default" data-delca-default="">
<div class="delca-balances">
<div class="delca-balance-row"><span>払戻金</span><strong>123,456,789 <small>円</small></strong></div>
<div class="delca-balance-row"><span>デルカ</span><strong>123,456,789 <small>pt</small></strong></div>
</div>
<div class="delca-actions">
<button type="button">投票履歴</button>
<button type="button">デルカチャージ</button>
</div>
</div>
</section>
<gamboo-race-info race-filter-disabled=""></gamboo-race-info>
<nav aria-label="賭式選択" class="bet-type-menu">
<button aria-pressed="true" class="bet-type-tab active" data-bet-type="3連単" type="button">3連単</button>
<button aria-pressed="false" class="bet-type-tab" data-bet-type="3連複" type="button">3連複</button>
<button aria-pressed="false" class="bet-type-tab" data-bet-type="2連単" type="button">2連単</button>
<button aria-pressed="false" class="bet-type-tab" data-bet-type="2連複" type="button">2連複</button>
<button aria-pressed="false" class="bet-type-tab" data-bet-type="ワイド" type="button">ワイド</button>
<button aria-pressed="false" class="bet-type-tab" data-bet-type="単勝" type="button">単勝</button>
</nav>
<main class="bet-page">
<section aria-label="投票入力表" class="bet-table-section">
<div class="bet-table-scroll">
<table class="bet-table">
<colgroup>
<col class="col-car"/><col class="col-rider"/>
<col class="col-photo bet-desktop-detail"/><col class="col-hst bet-desktop-detail"/><col class="col-trial bet-desktop-detail"/><col class="col-good-ten bet-desktop-detail"/>
<col class="col-pick"/><col class="col-pick"/><col class="col-pick"/><col class="col-pick col-box"/>
</colgroup>
<thead><tr><th>車番</th><th>選手</th><th class="bet-desktop-detail">写真</th><th class="bet-desktop-detail">ST･H</th><th class="bet-desktop-detail">試走T</th><th class="bet-desktop-detail">良10走T</th><th>1着</th><th>2着</th><th>3着</th><th class="box-divider">ボックス</th></tr></thead>
<tbody id="bet-table-body"></tbody>
<tfoot>
<tr>
<td class="bet-options-cell" colspan="2">
<label class="bet-option"><input id="multi-reverse-option" type="checkbox"/><span>マルチ・裏目</span></label>
</td>
<td class="column-actions"><button data-column-all="first">全</button><button data-column-clear="first">消</button></td>
<td class="column-actions"><button data-column-all="second">全</button><button data-column-clear="second">消</button></td>
<td class="column-actions"><button data-column-all="third">全</button><button data-column-clear="third">消</button></td>
<td class="column-actions box-divider"><button data-column-all="box">全選</button><button data-column-clear="box">全消</button></td>
</tr>
</tfoot>
</table>
</div>
</section>
<div aria-label="選択状況" class="selection-meta-row">
<span>選択一覧</span><span id="selection-count">0点</span>
</div>
<div class="selection-action-row">
<button aria-label="選択内容をセット" class="bet-confirm-float" hidden="" id="bet-confirm" type="button"><span aria-hidden="true" class="bet-confirm-label-mobile">選択内容をセット</span><span aria-hidden="true" class="bet-confirm-label-desktop">選択内容をセット</span></button>
</div>
<section aria-label="選択一覧" class="selection-section">
<div class="selection-list" id="selection-list">
<div class="selection-empty">買い目を選択してください</div>
</div>
</section>
</main>
</div>
</div>
</div>

</body>
</html>
