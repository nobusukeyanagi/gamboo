<body>
<gamboo-category-menu active="results"></gamboo-category-menu>
<div class="gamboo-content-shell" data-gamboo-pinch-shell="">

<gamboo-race-info></gamboo-race-info>
<nav aria-label="リプレイメニュー" class="result-replay-menu">
<button aria-pressed="false" class="result-replay-tab" data-replay-title="レースリプレイ" data-replay-url="https://autorace.jp/race_info/Ondemand/asx/hamamatsu/2026-02-23_12" type="button">レースリプレイ</button>

<main class="vote-results-page">
<section aria-labelledby="race-result-heading" class="result-section">
<h1 class="result-section-heading" id="race-result-heading">レース結果</h1>
<div class="result-card result-table-card">

<colgroup>
<col class="finish-col"/>
<col class="car-col"/>
<col class="rider-col"/>
<col class="handicap-col"/>
<col class="trial-col"/>
<col class="race-time-col"/>
<col class="start-col"/>
<col class="incident-col"/>
</colgroup>
<thead>
<tr><th>着順</th><th>車番</th><th>選手</th><th>H</th><th>試走T</th><th>競走T</th><th>ST</th><th>異</th></tr>
</thead>
<tbody id="race-result-body"></tbody>
</table>
</div>
</section>
<section aria-labelledby="payout-heading" class="result-section">
<h2 class="result-section-heading" id="payout-heading">払戻金</h2>
<div class="result-card result-table-card">
<table aria-label="払戻金" class="payout-table">
<colgroup><col class="payout-type-col"/><col class="payout-combination-col"/><col class="payout-value-col"/><col class="payout-popularity-col"/></colgroup>
<thead><tr><th>賭式</th><th>的中組番</th><th>払戻金</th><th>人気</th></tr></thead>

</table>
</div>
</section>
<section aria-labelledby="grand-note-heading" class="result-section grand-note-section">
<h2 class="result-section-heading" id="grand-note-heading">グランドノート</h2>
<div class="result-card grand-note-card">
<div class="grand-note-scroll">
<table aria-label="グランドノート" class="grand-note-table">
<thead id="grand-note-head"></thead>
<tbody id="grand-note-body"></tbody>
</table>
</div>
</div>
</section>
</main>
